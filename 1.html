<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowDiary | Anonymous Spaces</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #6366f1;
            
            /* Category Colors */
            --love: #f43f5e;
            --family: #38bdf8;
            --thoughts: #a855f7;
            --friends: #f59e0b;
            --learn: #10b981;
            --future: #ec4899;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin: 10px 0 0 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Glassmorphism Editor Box */
        .write-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-glow);
        }

        .box-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        select {
            background: #0f172a;
            color: white;
            border: 1px solid var(--glass-border);
            padding: 10px 15px;
            border-radius: 10px;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Diary Cards */
        .diary-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .anonymous-alias {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge {
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
        }

        .diary-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 20px;
            white-space: pre-wrap; /* Remembers line breaks */
        }

        /* Feedback/Comments Style */
        .interaction-area {
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        .feedback-list {
            margin-bottom: 15px;
        }

        .feedback-item {
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border-left: 4px solid var(--accent-glow);
            animation: fadeIn 0.3s ease;
        }

        .feedback-type {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 4px;
        }

        .type-advice { color: #38bdf8; border-color: #38bdf8; }
        .type-complement { color: #f59e0b; border-color: #f59e0b; }
        .type-comment { color: #a855f7; border-color: #a855f7; }

        .reply-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .reply-input {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            color: white;
            outline: none;
        }

        .reply-input:focus { border-color: var(--accent-glow); }

        .reply-type-select {
            background: #0f172a;
            color: white;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 0 10px;
        }

        .feed-status {
            color: var(--text-muted);
            margin: 0 0 20px;
        }

        .feed-status.error {
            color: #fda4af;
        }
    </style>
</head>
<body>

    <header>
        <h1>Incognito Journals</h1>
        <p>No identities. Just raw human thoughts, advice, and empathy.</p>
    </header>

    <div class="container">
        <div class="write-box">
            <textarea id="diaryInput" maxlength="5000" placeholder="Write what you can't tell anyone out loud..."></textarea>
            <div class="box-footer">
                <select id="categoryInput">
                    <option value="Thoughts" selected>Thoughts</option>
                    <option value="Love Story">Love Story</option>
                    <option value="Family">Family</option>
                    <option value="Friends Issue">Friends Issue</option>
                    <option value="Learn">Learn</option>
                    <option value="Future Thinking">Future Thinking</option>
                </select>
                <button class="btn-primary" id="postButton" type="button">Post Anonymously</button>
            </div>
        </div>

        <p id="feedStatus" class="feed-status" role="status" aria-live="polite">Connecting to the journal...</p>
        <div id="diaryFeed"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const commentTypes = {
            Advice: { className: "type-advice", icon: "💡" },
            Complement: { className: "type-complement", icon: "🌸" },
            Comment: { className: "type-comment", icon: "💬" }
        };
        const feed = document.getElementById("diaryFeed");
        const feedStatus = document.getElementById("feedStatus");
        const postButton = document.getElementById("postButton");

        function setStatus(message, isError = false) {
            feedStatus.textContent = message;
            feedStatus.classList.toggle("error", isError);
            feedStatus.hidden = message === "";
        }

        function createFeedbackItem(comment) {
            const details = commentTypes[comment.type];
            const item = document.createElement("div");
            item.className = "feedback-item";

            const label = document.createElement("span");
            label.className = `feedback-type ${details.className}`;
            label.textContent = `${details.icon} ${comment.type}`;
            item.append(label, document.createTextNode(comment.body));
            return item;
        }

        function createPostCard(post) {
            const card = document.createElement("article");
            card.className = "diary-card";

            const meta = document.createElement("div");
            meta.className = "card-meta";
            const alias = document.createElement("span");
            alias.className = "anonymous-alias";
            alias.textContent = "👤 Anonymous Soul";
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = post.category;
            meta.append(alias, badge);

            const body = document.createElement("div");
            body.className = "diary-body";
            body.textContent = post.body;

            const interactionArea = document.createElement("div");
            interactionArea.className = "interaction-area";
            const feedbackList = document.createElement("div");
            feedbackList.className = "feedback-list";
            post.comments.forEach(comment => feedbackList.appendChild(createFeedbackItem(comment)));

            const replyBox = document.createElement("form");
            replyBox.className = "reply-box";
            const typeSelect = document.createElement("select");
            typeSelect.className = "reply-type-select";
            typeSelect.setAttribute("aria-label", "Feedback type");
            Object.keys(commentTypes).forEach(type => {
                const option = document.createElement("option");
                option.value = type;
                option.textContent = type;
                typeSelect.appendChild(option);
            });

            const input = document.createElement("input");
            input.type = "text";
            input.maxLength = 1000;
            input.required = true;
            input.className = "reply-input";
            input.placeholder = "Leave your feedback...";
            input.setAttribute("aria-label", "Feedback");

            const button = document.createElement("button");
            button.type = "submit";
            button.className = "btn-primary";
            button.style.padding = "10px 18px";
            button.textContent = "Reply";

            replyBox.append(typeSelect, input, button);
            replyBox.addEventListener("submit", event => submitComment(event, post.id, input, typeSelect, button));
            interactionArea.append(feedbackList, replyBox);
            card.append(meta, body, interactionArea);
            return card;
        }

        async function loadPosts(client) {
            setStatus("Loading journal entries...");
            const { data: posts, error: postsError } = await client
                .from("posts")
                .select("id, body, category, created_at")
                .order("created_at", { ascending: false });
            if (postsError) throw postsError;

            const { data: comments, error: commentsError } = await client
                .from("comments")
                .select("id, post_id, body, type, created_at")
                .order("created_at", { ascending: true });
            if (commentsError) throw commentsError;

            const commentsByPost = new Map();
            comments.forEach(comment => {
                const postComments = commentsByPost.get(comment.post_id) || [];
                postComments.push(comment);
                commentsByPost.set(comment.post_id, postComments);
            });

            feed.replaceChildren(...posts.map(post => createPostCard({
                ...post,
                comments: commentsByPost.get(post.id) || []
            })));
            setStatus(posts.length ? "" : "No journal entries yet. Be the first to post.");
        }

        async function submitPost(client) {
            const input = document.getElementById("diaryInput");
            const content = input.value.trim();
            const category = document.getElementById("categoryInput").value;
            if (!content) {
                setStatus("Please write something before posting.", true);
                return;
            }

            postButton.disabled = true;
            setStatus("Saving your post...");
            const { error } = await client.from("posts").insert({ body: content, category });
            if (error) {
                setStatus(`Could not save your post: ${error.message}`, true);
            } else {
                input.value = "";
                try {
                    await loadPosts(client);
                } catch (loadError) {
                    setStatus(`Your post was saved, but the feed could not be refreshed: ${loadError.message}`, true);
                }
            }
            postButton.disabled = false;
        }

        async function submitComment(event, postId, input, typeSelect, button) {
            event.preventDefault();
            const content = input.value.trim();
            if (!content) {
                setStatus("Please type a comment before replying.", true);
                return;
            }

            button.disabled = true;
            setStatus("Saving your feedback...");
            const { error } = await client.from("comments").insert({
                post_id: postId,
                body: content,
                type: typeSelect.value
            });
            if (error) {
                setStatus(`Could not save your feedback: ${error.message}`, true);
                button.disabled = false;
                return;
            }

            input.value = "";
            try {
                await loadPosts(client);
            } catch (loadError) {
                setStatus(`Your feedback was saved, but the feed could not be refreshed: ${loadError.message}`, true);
            }
        }

        if (!window.supabase) {
            setStatus("Could not load the Supabase client. Check your internet connection and reload.", true);
        } else if (SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") {
            setStatus("Set your Supabase project URL and anon key in this file, then reload.", true);
        } else {
            const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            postButton.addEventListener("click", () => submitPost(client));
            loadPosts(client).catch(error => {
                setStatus(`Could not load journal entries: ${error.message}`, true);
            });
        }
    </script>
</body>
</html>

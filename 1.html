<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowDiary | Anonymous Spaces</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #6366f1;
            
            /* Category Colors */
            --love: #f43f5e;
            --family: #38bdf8;
            --thoughts: #a855f7;
            --friends: #f59e0b;
            --learn: #10b981;
            --future: #ec4899;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin: 10px 0 0 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Shared: Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
        }

        .write-box {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        /* Shared: Dark Input Base */
        .dark-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: white;
            outline: none;
            transition: border 0.3s;
        }

        .dark-input:focus {
            border-color: var(--accent-glow);
        }

        /* Shared: Dark Select Base */
        .dark-select {
            background: #0f172a;
            color: white;
            border: 1px solid var(--glass-border);
            outline: none;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
        }

        .box-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        select {
            padding: 10px 15px;
            border-radius: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Diary Cards */
        .diary-card {
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .anonymous-alias {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge {
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
        }

        .diary-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* Feedback/Comments Style */
        .interaction-area {
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        .feedback-list {
            margin-bottom: 15px;
        }

        .feedback-item {
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border-left: 4px solid var(--accent-glow);
            animation: fadeIn 0.3s ease;
        }

        .feedback-type {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 4px;
        }

        .type-advice { color: #38bdf8; border-color: #38bdf8; }
        .type-complement { color: #f59e0b; border-color: #f59e0b; }
        .type-comment { color: #a855f7; border-color: #a855f7; }

        .reply-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .reply-input {
            flex: 1;
            border-radius: 10px;
            padding: 12px;
        }

        .reply-type-select {
            border-radius: 10px;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Incognito Journals</h1>
        <p>No identities. Just raw human thoughts, advice, and empathy.</p>
    </header>

    <div class="container">
        <div class="write-box glass-panel">
            <textarea id="diaryInput" class="dark-input" placeholder="Write what you can't tell anyone out loud..."></textarea>
            <div class="box-footer">
                <select id="categoryInput" class="dark-select">
                    <option value="Thoughts" selected>Thoughts</option>
                    <option value="Love Story">Love Story</option>
                    <option value="Family">Family</option>
                    <option value="Friends Issue">Friends Issue</option>
                    <option value="Learn">Learn</option>
                    <option value="Future Thinking">Future Thinking</option>
                </select>
                <button class="btn-primary" onclick="createNewPost()">Post Anonymously</button>
            </div>
        </div>

        <div id="diaryFeed"></div>
    </div>

    <script>
        // ─── Shared Utilities ───────────────────────────────────────────

        // Feedback type configuration: maps type names to their display properties
        const FEEDBACK_TYPES = {
            Advice:     { cssClass: 'type-advice',     icon: '💡' },
            Complement: { cssClass: 'type-complement', icon: '🌸' },
            Comment:    { cssClass: 'type-comment',    icon: '💬' }
        };

        // Validates that an input string is non-empty; shows alert and returns false if empty
        function validateNonEmpty(value, message) {
            if (value.trim() === "") {
                alert(message);
                return false;
            }
            return true;
        }

        // Builds the reply box HTML used inside every diary card
        function buildReplyBoxHTML() {
            return `
                <div class="reply-box">
                    <select class="reply-type-select dark-select">
                        ${Object.keys(FEEDBACK_TYPES).map(type =>
                            `<option value="${type}">${type}</option>`
                        ).join('')}
                    </select>
                    <input type="text" class="reply-input dark-input" placeholder="Leave your feedback...">
                    <button class="btn-primary" style="padding: 10px 18px;" onclick="addComment(this)">Reply</button>
                </div>`;
        }

        // Builds a single feedback item HTML element
        function buildFeedbackItemHTML(type, text) {
            const { cssClass, icon } = FEEDBACK_TYPES[type] || FEEDBACK_TYPES.Comment;
            return `
                <div class="feedback-item">
                    <span class="feedback-type ${cssClass}">${icon} ${type}</span>
                    ${text}
                </div>`;
        }

        // Builds a complete diary card HTML structure
        function buildDiaryCardHTML(alias, category, body, feedbackItems) {
            const feedbackHTML = feedbackItems
                .map(item => buildFeedbackItemHTML(item.type, item.text))
                .join('');

            return `
                <div class="card-meta">
                    <span class="anonymous-alias">👤 ${alias}</span>
                    <span class="badge">${category}</span>
                </div>
                <div class="diary-body">${body}</div>
                <div class="interaction-area">
                    <div class="feedback-list">${feedbackHTML}</div>
                    ${buildReplyBoxHTML()}
                </div>`;
        }

        // ─── Application Logic ──────────────────────────────────────────

        // Renders the initial seed data on page load
        function renderSeedPosts() {
            const seedData = [
                {
                    alias: 'Someone deep in thought...',
                    category: 'Love Story',
                    categoryColor: '#f43f5e',
                    body: "I'm scared that if I confess my feelings, it will ruin everything we've built over 5 years. But watching them date other people is slowly breaking my heart. How do I stop loving someone without losing them?",
                    feedback: [
                        { type: 'Advice', text: 'You are already losing them by staying silent while your heart breaks. Take the leap. True friendship can survive honesty.' }
                    ]
                }
            ];

            const feed = document.getElementById('diaryFeed');
            seedData.forEach(post => {
                const card = document.createElement('div');
                card.className = 'diary-card glass-panel';
                card.innerHTML = buildDiaryCardHTML(post.alias, post.category, post.body, post.feedback);

                // Apply category color to the badge
                const badge = card.querySelector('.badge');
                badge.style.color = post.categoryColor;
                badge.style.borderColor = post.categoryColor;

                // Apply border color to seed feedback items
                post.feedback.forEach((item, i) => {
                    const feedbackEl = card.querySelectorAll('.feedback-item')[i];
                    const { cssClass } = FEEDBACK_TYPES[item.type] || FEEDBACK_TYPES.Comment;
                    if (cssClass === 'type-advice') feedbackEl.style.borderLeftColor = '#38bdf8';
                    else if (cssClass === 'type-complement') feedbackEl.style.borderLeftColor = '#f59e0b';
                });

                feed.appendChild(card);
            });
        }

        // Creates a new anonymous journal post from user input
        function createNewPost() {
            const input = document.getElementById('diaryInput');
            const content = input.value.trim();
            const category = document.getElementById('categoryInput').value;

            if (!validateNonEmpty(content, "Please write something before posting!")) return;

            const feed = document.getElementById('diaryFeed');
            const newCard = document.createElement('div');
            newCard.className = 'diary-card glass-panel';
            newCard.innerHTML = buildDiaryCardHTML('Anonymous Soul', category, content, []);

            feed.insertBefore(newCard, feed.firstChild);
            input.value = "";
        }

        // Appends a reply/comment to a specific diary card
        function addComment(buttonElement) {
            const replyBox = buttonElement.parentElement;
            const textInput = replyBox.querySelector('.reply-input');
            const typeSelect = replyBox.querySelector('.reply-type-select');
            
            const commentText = textInput.value.trim();
            const commentType = typeSelect.value;

            if (!validateNonEmpty(commentText, "Please type a comment before replying!")) return;

            const interactionArea = replyBox.parentElement;
            const feedbackList = interactionArea.querySelector('.feedback-list');

            feedbackList.insertAdjacentHTML('beforeend', buildFeedbackItemHTML(commentType, commentText));
            textInput.value = "";
        }

        // Initialize the page with seed content
        renderSeedPosts();
    </script>
</body>
</html>
